spring.application.name=sentiveillance_project

# ---------------------------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------------------------
# !! Fill in the role and password that own the 'sentiveillance' database !!
spring.datasource.url=jdbc:postgresql://localhost:5432/sentiveillance
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# 'update' lets Hibernate create the two tables on first run. Switch to 'validate'
# once the schema is stable and manage it with migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ---------------------------------------------------------------------------
# NOTE: spring-boot-devtools is deliberately NOT a dependency of this project.
# Its restart class loader re-runs main() in the same JVM, which re-loads
# libNCore.so through JNA a second time. Setting spring.devtools.restart.enabled
# =false here is too late - the restart class loader is installed before
# application.properties is read. Do not add devtools back.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# SDK
# ---------------------------------------------------------------------------
# Resolved by SdkBootstrap; shown here for reference and for the /api/status output.
sentiveillance.sdk.root=${sentiveillance.sdk.root:}
sentiveillance.sdk.trial-mode=true
sentiveillance.sdk.license-server=/local
sentiveillance.sdk.license-port=5000
sentiveillance.sdk.use-gpu=false

# ---------------------------------------------------------------------------
# The one source. Switch type to IP_CAMERA and fill in the url for the Dahua.
# ---------------------------------------------------------------------------
# --- Option A: video file (current) ------------------------------------------
sentiveillance.source.type=VIDEO_FILE
sentiveillance.source.name=source-1
sentiveillance.source.file=my_files/Two_person_walking_video.mp4

# --- Option B: Dahua DH-IPC-HDW2431TP-AS-S2 over RTSP -------------------------
# To switch: set type=IP_CAMERA, fill in url, and comment out the file line above.
# subtype=0 is the main stream (2688x1520) - use it; subtype=1 is the low-res
# sub stream, where faces at ceiling height are usually too small to recognise.
# Validate the URL first with:  scripts/check-camera.sh 'rtsp://...'
#sentiveillance.source.type=IP_CAMERA
#sentiveillance.source.name=gate-camera
#sentiveillance.source.url=rtsp://USER:PASSWORD@192.168.1.108:554/cam/realmonitor?channel=1&subtype=0

# Media-plugin backend selection. Leave empty to let the SDK choose. On Linux the
# backends are FFmpeg and VLC, so the only meaningful values here are
# DoNotUseVlc (force FFmpeg), DoNotUseFFmpeg (force VLC) or PreferVlc.
# The other values the SDK lists (DirectShow, WindowsMedia*) are Windows-only.
sentiveillance.source.flags=

# Run the body detector as well (the VEHICLES_AND_HUMANS modality). Off = faces only.
# Measured on the test clip: faces+bodies gave ~1020x3624 boxes (the whole person) and ~4700ms
# detector lag; faces only gives ~170x233 boxes and ~214ms. The cost of faces-only is that a
# person facing away is not tracked, and range shortens - a face is far fewer pixels than a
# body, so at distance the body is visible when the face is already too small.
# With this off, detector-scaling below has no effect; face range is governed by
# faces.minimal-inter-ocular-distance.
sentiveillance.source.detect-people=false
# false = at startup the engine is built, the watch list loaded and the source attached,
# but no frame is read until the dashboard's "Start source" button (or
# POST /api/surveillance/start) asks for it. Set true to capture from boot.
sentiveillance.source.auto-start=false

# ---------------------------------------------------------------------------
# Face detection / recognition thresholds
# ---------------------------------------------------------------------------
sentiveillance.faces.matching-threshold=48
sentiveillance.faces.matching-maximal-result-count=5
sentiveillance.faces.quality-threshold=30
sentiveillance.faces.minimal-inter-ocular-distance=24
sentiveillance.faces.template-size=LARGE

# ---------------------------------------------------------------------------
# People only
# ---------------------------------------------------------------------------
# This pipeline is scoped to humans: faces and bodies, nothing else.
#   * licence-plate recognition is never licensed and its modality is never enabled
#   * vehicle attribute extraction is switched off in SurveillanceEngine
#   * the SDK's body detector cannot be told "people only" - it always classifies boxes
#     as PERSON/CAR/BUS/TRUCK/BIKE - so non-person detections are discarded below.
#     Watch the 'nonHumanIgnored' counter on /api/status to see how many that is.
sentiveillance.people.humans-only=true
sentiveillance.people.detector-threshold=50
# Scales the object detector runs: ONE/TWO/THREE/FOUR. This decides how FAR AWAY a person
# is still detected, and trades directly against overlay latency. Measured on CPU at
# 2160x3840, same clip each time:
#   ONE    4 subjects    8 recognised      peak lag  2.4s
#   TWO    5 subjects   14-16 recognised   peak lag  5-7s    <-- current
#   THREE  5 subjects   16 recognised      peak lag 10.7s
#   FOUR   7-8 subjects  7 recognised      peak lag 17-19s   (~3x the range, but the
#                                                             overlay is no longer live)
# Raise to FOUR if you need maximum range and can accept the overlay arriving late.
# The way to get range AND speed is fewer pixels per frame, not a different value here.
sentiveillance.people.detector-scaling=TWO
# Frame-rate cap for the detector, in seconds between frames. This is what stops the overlay
# drifting further behind the longer the camera runs: the detector manages ~0.57x real time on
# this 2160x3840 source, so without a cap it accumulates backlog forever.
# Measured peak lag on the test clip: 0.17 (SDK default) ~4900ms, 0.33 ~2270ms, 0.50 ~810ms.
# Both people were still recognised at every setting. Use 0 to keep the SDK default.
sentiveillance.people.detector-min-frame-time-seconds=0.33
sentiveillance.people.detect-clothing-details=true
sentiveillance.people.detect-face-and-head-coverings=true
sentiveillance.people.estimate-age-group=false

# ---------------------------------------------------------------------------
# Enrolment + snapshots
# ---------------------------------------------------------------------------
# Photo-based enrolment at startup. Off: people are enrolled from the video instead -
# detected, found to be unknown, queued with the face template captured during their visit,
# then named from the dashboard ("Unidentified people" panel / POST /api/unknown/{id}/enroll).
# With this off the photo directory is never read and no NBiometricEngine is built at startup;
# the watch list is loaded from the database as it stands.
sentiveillance.enrollment.enabled=false
sentiveillance.enrollment.photos-directory=my_files
sentiveillance.enrollment.re-enroll-existing=false
# Preview feed. Encoding 8-megapixel JPEGs competes with the detector for CPU: measured at
# detectorScaling=ONE, detection lag peaked at 3.5s with nobody watching and 4.9s with a
# browser pulling a frame every 80ms. 200ms (5 fps) is the compromise.
sentiveillance.live.preview-interval-millis=200
sentiveillance.live.demand-timeout-millis=5000

sentiveillance.snapshots.enabled=true
sentiveillance.snapshots.directory=var/snapshots

logging.level.com.raihan.sentiveillance_project=INFO
